name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Which part of WulfVault?
      options:
        - Uploads and sharing
        - Downloads and recipient experience
        - Users, quotas and administration
        - Authentication (2FA, SSO, OIDC)
        - Audit logging and GDPR
        - Branding, e-mail and templates
        - API
        - Deployment (Docker, systemd, reverse proxy)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe the situation, not the solution. Who runs into it and how often?
    validations:
      required: true
  - type: textarea
    id: wanted-behaviour
    attributes:
      label: How should WulfVault behave?
      description: Mock-ups, example configuration or API shapes are welcome.
    validations:
      required: true
  - type: textarea
    id: workarounds
    attributes:
      label: What do you do today instead?
      description: Workarounds, or other tools that cover this and how.
  - type: checkboxes
    id: confirm
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions for the same idea.
          required: true
        - label: I am willing to help test this once implemented.
