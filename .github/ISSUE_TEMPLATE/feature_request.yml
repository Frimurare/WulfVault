name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. Who runs into it and how often?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like WulfVault to behave? Mock-ups, example configuration or API shapes are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Workarounds you use today, or other tools that solve this and how.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Uploads and sharing
        - Downloads and recipient experience
        - Users, quotas and administration
        - Authentication (2FA, SSO, OIDC)
        - Audit logging and GDPR
        - Branding, e-mail and templates
        - API
        - Deployment (Docker, systemd, reverse proxy)
        - Documentation
        - Other
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for the same idea.
          required: true
        - label: I am willing to help test this once implemented.
